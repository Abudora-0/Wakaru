<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Wakaru">
  <title>Wakaru</title>
  <desc>The small size cut of the Wakaru mark, simplified so it stays legible as a favicon.</desc>

  <!--
    The small cut is a separate drawing, not the full mark scaled down.
    Below about 48 pixels the tail and the trailing drops turn to mush, so the
    balloon fills the frame, the strokes are heavier, and only the largest drop
    survives.
  -->
  <rect width="128" height="128" rx="14" fill="#14110f" />

  <g
    transform="translate(20 16) scale(0.62)"
    fill="none"
    stroke="#f4efe6"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M44 8 L18 42" />
    <path d="M58 8 L84 42" />
    <path d="M22 54 H70 C72 74 66 86 54 92" />
    <path d="M44 54 C40 70 34 82 20 92" />
  </g>

  <circle cx="104" cy="26" r="13" fill="#d8412f" />
</svg>
