<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Wakaru">
  <title>Wakaru</title>
  <desc>The small size cut of the Wakaru tile, with a larger balloon and heavier strokes so the kanji survives at favicon and toolbar sizes.</desc>

  <!--
    Below about 48 pixels the balloon tail and the thin strokes collapse, so
    this cut enlarges the balloon to fill the tile, thickens every stroke and
    shrinks the tail to a stub. It is a separate drawing, not the tile scaled
    down.
  -->
  <rect width="128" height="128" rx="16" fill="#14110f" />

  <g transform="translate(2 8) scale(1.52)">
    <path
      d="M34 8 C54 8 68 21 68 36 C68 51 54 62 36 62 L30 62 C29 66 26 70 20 73 C23 68 23 65 21 62 C10 58 4 48 4 36 C4 21 16 8 34 8 Z"
      fill="#f4efe6"
    />
    <g
      transform="translate(15.5 14) scale(0.4)"
      fill="none"
      stroke="#14110f"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M44 8 L18 42" />
      <path d="M58 8 L84 42" />
      <path d="M22 54 H70 C72 74 66 86 54 92" />
      <path d="M44 54 C40 70 34 82 20 92" />
    </g>
  </g>

  <circle cx="108" cy="24" r="14" fill="#d8412f" />
</svg>
