<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Wakaru">
  <title>Wakaru</title>
  <desc>An ink brush speech balloon with the kanji for understanding knocked out of it, and vermilion ink drops falling away from the tail.</desc>

  <g transform="translate(6 8) scale(1.28)">
    <path
      d="M34 8 C54 8 68 21 68 36 C68 51 54 62 36 62 L30 62 C29 68 25 73 18 76 C22 70 22 66 20 62 C10 58 4 48 4 36 C4 21 16 8 34 8 Z"
      fill="#14110f"
    />

    <!-- The kanji is drawn as strokes rather than set as text, so the mark
         never depends on a CJK font being installed on the viewer's machine.
         Authored in a 100 unit box, then scaled into the balloon. -->
    <g
      transform="translate(18 17) scale(0.359)"
      fill="none"
      stroke="#f4efe6"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M44 8 L18 42" />
      <path d="M58 8 L84 42" />
      <path d="M22 54 H70 C72 74 66 86 54 92" />
      <path d="M44 54 C40 70 34 82 20 92" />
    </g>
  </g>

  <circle cx="107" cy="44" r="8.5" fill="#d8412f" />
  <circle cx="116" cy="69" r="4.6" fill="#d8412f" opacity="0.62" />
  <circle cx="110" cy="88" r="2.5" fill="#d8412f" opacity="0.4" />
</svg>
